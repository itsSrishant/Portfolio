    <!-- Static Person JSON-LD — present even before JS runs, so crawlers
         that don't execute JavaScript still get structured identity data.
         DocumentMeta.tsx enriches this further and adds per-project schemas
         once React has mounted. -->
    <script type="application/ld+json" id="ld-person-static">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Srishant Kulkarni",
      "url": "https://srishantkulkarni-portfolio.vercel.app",
      "jobTitle": "AI & Data Science Student / Software Engineer",
      "email": "imsrishant@gmail.com",
      "image": "https://srishantkulkarni-portfolio.vercel.app/srishant-portrait.jpg",
      "description": "B.Tech Artificial Intelligence & Data Science student at VESIT, Mumbai, building AI-powered voice systems, web applications, and backend services.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Mumbai, Maharashtra, India"
      },
      "alumniOf": {
        "@type": "EducationalOrganization",
        "name": "Vivekanand Education Society's Institute of Technology",
        "url": "https://vesit.ves.ac.in"
      },
      "knowsAbout": ["Artificial Intelligence", "Machine Learning", "Voice AI", "Retrieval-Augmented Generation", "React", "TypeScript", "Python", "FastAPI"],
      "sameAs": [
        "https://github.com/itsSrishant",
        "https://www.linkedin.com/in/srishantkulkarni/"
      ]
    }
    </script>
  </head>
  <body>

    <script type="module" src="/src/main.tsx"></script>
  </body>
